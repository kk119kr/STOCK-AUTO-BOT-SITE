<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>봇 매매일지 98</title>
<meta name="description" content="국장·미장 자동매매 봇의 하루 성적표">
<link rel="icon" href="assets/robot.png">
<style>
/* VOICE occasion: a loud, fancy Y2K retro desktop — my two trading bots live inside an old OS
   IDEA the page is a 98-style desktop with colourful program windows; each window is one part of the report
   PICTURE TODAY.EXE: a 3D robot (KR bot) and alien (US bot) floating over a sticker scene with confetti or rain
   COLOUR cobalt desk with grid, cream windows, title bars in hot pink, lime, tangerine, cyan, violet, lemon; black outlines; red up / blue down for money
   TYPE Galmuri11 (Korean pixel font) everywhere, bold for numbers
   LAYOUT ticker, title row, TODAY window full width, then SCORE + CALENDAR, CHART + LOOT; phone stacks */
@font-face{font-family:Galmuri;src:url(fonts/Galmuri11.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Galmuri;src:url(fonts/Galmuri11-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
:root{color-scheme:light;--desk:#2f4dff;--grid:#4a64ff;--win:#fffdf2;--ink:#111;--pink:#ff4fa3;--lime:#b8ff3d;--tang:#ff8a1f;--cyan:#2ee6ff;--vio:#8b5cff;--lemon:#ffe14d;--up:#ff2d55;--dn:#1f5bff;--soft:#6b6457}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--desk);background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:40px 40px;color:var(--ink);font:15px/1.6 Galmuri,"Apple SD Gothic Neo",monospace;overflow-x:clip}
.tick{background:var(--lemon);border-bottom:3px solid var(--ink);overflow:hidden;white-space:nowrap;font-weight:700}
.tick div{display:inline-block;padding:6px 0;animation:mq 26s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.band{padding:clamp(14px,3vw,30px) max(4vw,16px)}
.wrap{max-width:1160px;margin:0 auto;display:grid;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:clamp(32px,6vw,52px);line-height:1.05;margin:0;color:#fff;text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--pink);font-weight:700}
.pill{background:var(--win);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:4px 12px;border-radius:999px;font-size:13px}
.win{background:var(--win);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);border-radius:8px;overflow:hidden}
.tb{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-bottom:3px solid var(--ink);font-weight:700}
.tb i{display:inline-flex;gap:5px;font-style:normal}
.tb b{width:16px;height:16px;border:2px solid var(--ink);background:var(--win);display:inline-block;border-radius:3px}
.body{padding:16px}
.pink{background:var(--pink)}.lime{background:var(--lime)}.tang{background:var(--tang)}.cyan{background:var(--cyan)}.vio{background:var(--vio);color:#fff}.lemon{background:var(--lemon)}
.scene{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:22px 18px 18px;background:linear-gradient(#ffd6ec 0 50%,#c9f7ff 50%);background-size:100% 100%;min-height:330px;overflow:hidden}
.scene::before{content:"";position:absolute;inset:auto 0 0 0;height:38%;background:repeating-linear-gradient(90deg,#b8ff3d 0 30px,#a3ef25 30px 60px);border-top:3px solid var(--ink)}
.bot{position:relative;display:grid;grid-template-columns:minmax(110px,44%) minmax(0,1fr);align-items:center;gap:12px;z-index:1}
.char{position:relative;aspect-ratio:1}
.char img.me{width:100%;height:100%;object-fit:contain;filter:drop-shadow(5px 6px 0 rgba(0,0,0,.25));animation:bob 2.4s ease-in-out infinite}
.bot:nth-child(2) .char img.me{animation-delay:-1.2s}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.char .hat{position:absolute;width:42%;left:29%;top:-18%;animation:bob 2.4s ease-in-out infinite}
.char .wx{position:absolute;width:56%;left:22%;top:-34%}
.card{background:var(--win);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:10px;padding:10px 12px;transform:rotate(-1.5deg)}
.bot:nth-child(2) .card{transform:rotate(1.5deg)}
.lab{display:inline-block;font-weight:700;font-size:13px;border:2px solid var(--ink);border-radius:6px;padding:0 8px}
.big{font-weight:700;font-size:clamp(24px,3.6vw,38px);line-height:1.15;white-space:nowrap;margin:6px 0 2px}
.up{color:var(--up)}.dn{color:var(--dn)}.zero{color:var(--soft)}
.meta{color:var(--soft);font-size:13px}
.coin{position:absolute;width:34px;top:-40px;animation:fall linear infinite;z-index:0}
@keyframes fall{to{transform:translateY(420px) rotate(540deg)}}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-top:3px solid var(--ink)}
.btn{font:700 15px Galmuri,monospace;border:3px solid var(--ink);background:var(--win);color:var(--ink);padding:8px 14px;min-height:44px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);border-radius:8px}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn.go{background:var(--pink);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.d.has:focus-visible,.tab:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.sc{display:grid;gap:14px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
.row img{width:44px}
.seg{display:flex;gap:3px;height:22px;margin:4px 0}
.seg span{flex:1;border:2px solid var(--ink);border-radius:3px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{text-align:center;font-size:12px;color:var(--soft)}
.d{aspect-ratio:1;border:2px dashed #d8d2c0;border-radius:8px;position:relative;font:12px Galmuri;background:transparent;padding:0;color:var(--soft)}
.d span{position:absolute;left:5px;top:2px}
.d.has{border:3px solid var(--ink);cursor:pointer;color:var(--ink)}
.d.p{background:var(--lemon)}.d.l{background:#bcd3ff}
.d.sel{box-shadow:3px 3px 0 var(--ink);transform:translate(-2px,-2px)}
.d img{position:absolute;width:56%;right:6%;bottom:6%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tab{font:700 13px Galmuri;border:2px solid var(--ink);background:var(--win);padding:4px 12px;min-height:40px;border-radius:999px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--ink);color:var(--lemon)}
.fig{position:relative;min-height:230px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.loot{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.loot li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;border:2px solid var(--ink);border-radius:8px;padding:6px 10px;background:#fff}
.loot img{width:30px}
.num{white-space:nowrap;font-weight:700;text-align:right}
.modal{position:fixed;inset:0;background:rgba(17,17,17,.72);display:none;place-items:center;padding:16px;z-index:9}
.modal.on{display:grid}
.modal .win{max-width:400px;width:100%}
.modal img{width:100%;max-height:60vh;object-fit:contain;border:3px solid var(--ink);border-radius:8px;display:block}
footer{color:#dfe5ff;font-size:12px}
footer a{color:#fff}
.seg3{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;box-shadow:4px 4px 0 var(--ink);background:var(--win)}
.seg3 button{font:700 14px Galmuri;border:0;background:transparent;padding:6px 14px;min-height:40px;cursor:pointer}
.seg3 button[aria-pressed=true]{background:var(--ink);color:var(--lemon)}
.seg3 button:focus-visible{outline:3px dashed var(--pink);outline-offset:-4px}
.wk{display:grid;grid-template-columns:64px repeat(5,minmax(0,1fr));gap:8px;align-items:stretch}
.wk .h{text-align:center;font-weight:700;font-size:14px;padding:4px 0;border-radius:6px}
.wk .h.today{background:var(--lemon);border:2px solid var(--ink)}
.wk .who{display:grid;justify-items:center;align-content:center;font-size:12px;font-weight:700}
.wk .who img{width:40px}
.cell{border:3px solid var(--ink);border-radius:10px;min-height:86px;display:grid;place-content:center;text-align:center;gap:2px;background:#fff;cursor:pointer;font:inherit;color:var(--ink);padding:4px 2px}
.cell b{font-size:clamp(22px,3.4vw,34px);line-height:1}
.cell small{font-size:12px;white-space:nowrap}
.cell.w{background:#ffd1dc}.cell.w b{color:var(--up)}
.cell.l{background:#cfe0ff}.cell.l b{color:var(--dn)}
.cell.off{background:repeating-linear-gradient(45deg,#f1ecdf 0 8px,#e7e0cf 8px 16px);color:var(--soft);cursor:default}
.cell.fut{border-style:dashed;border-color:#cfc7b2;background:transparent;color:#b8af99;cursor:default}
.cell.sel{box-shadow:4px 4px 0 var(--ink);transform:translate(-2px,-2px)}
.cell.dim{opacity:.35}
.cell:focus-visible{outline:3px dashed var(--pink);outline-offset:2px}
.wsum{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-weight:700}
@media(max-width:520px){.wk{grid-template-columns:40px repeat(5,minmax(0,1fr));gap:5px}.wk .who span{display:none}.wk .who img{width:32px}.cell{min-height:70px}.cell small{font-size:10px}}
.snd{font:700 13px Galmuri;border:3px solid var(--ink);border-radius:999px;background:var(--win);padding:6px 12px;min-height:40px;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.snd[aria-pressed=true]{background:var(--lime)}
.snd:focus-visible{outline:3px dashed var(--pink);outline-offset:2px}
@media(max-width:780px){.grid2{grid-template-columns:minmax(0,1fr)}.scene{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.tick div,.char img.me,.char .hat,.coin{animation:none}.coin{display:none}}
</style>
</head>
<body>
<div class="tick" aria-hidden="true"><div id="tick">★ 불러오는 중 ★</div></div>
<div class="band"><div class="wrap">
  <div class="head"><h1>봇 매매일지 98</h1><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><div class="seg3" role="group" aria-label="시장 보기"><button data-m="all" aria-pressed="true">전체</button><button data-m="kr" aria-pressed="false">국장</button><button data-m="us" aria-pressed="false">미장</button></div><button class="snd" id="bgmBtn" aria-pressed="false">♪ BGM 끔</button><button class="snd" id="sfxBtn" aria-pressed="false">효과음 끔</button><span class="pill" id="upd">loading…</span></div></div>

  <section class="win">
    <div class="tb lemon"><span id="wkT">WEEK.EXE</span><i><button class="btn" id="wPrev" style="min-height:32px;padding:2px 10px;box-shadow:2px 2px 0 var(--ink)" aria-label="지난주">◀</button><button class="btn" id="wNext" style="min-height:32px;padding:2px 10px;box-shadow:2px 2px 0 var(--ink)" aria-label="다음 주">▶</button></i></div>
    <div class="body"><div class="wk" id="wk"></div><div class="wsum" id="wsum"></div></div>
  </section>

  <section class="win">
    <div class="tb pink"><span id="todayT">TODAY.EXE</span><i><b></b><b></b><b></b></i></div>
    <div class="scene" id="scene"><div class="bot" id="kr"></div><div class="bot" id="us"></div></div>
    <div class="ctl">
      <div style="display:flex;gap:10px"><button class="btn" id="prev">◀ 전날</button><button class="btn" id="next">다음날 ▶</button></div>
      <strong id="sum"></strong>
      <button class="btn go" id="share">인스타 스토리 공유</button>
    </div>
  </section>

  <div class="grid2">
    <section class="win"><div class="tb lime"><span>SCORE.EXE</span><i><b></b><b></b></i></div><div class="body sc" id="score"></div></section>
    <section class="win"><div class="tb tang"><span id="calT">CALENDAR.APP</span><i><b></b><b></b></i></div><div class="body"><div class="cal" id="cal"></div></div></section>
  </div>
  <div class="grid2">
    <section class="win"><div class="tb cyan"><span>CHART.EXE · 누적 손익</span><i><b></b><b></b></i></div><div class="body">
      <div class="fig"><svg id="chart" role="img" aria-label="누적 손익 계단 그래프"></svg></div></div></section>
    <section class="win"><div class="tb vio"><span id="lootT">LOOT.TXT</span><i><b></b><b></b></i></div><div class="body"><ul class="loot" id="loot"></ul></div></section>
  </div>
  <footer>미장 금액은 봇 추정치(수수료 반영)를 그날 환율로 원화 환산했어요. 실제 체결·수수료는 한투 앱 기준.<br>
  캐릭터·아이콘 <a href="https://github.com/microsoft/fluentui-emoji">Microsoft Fluent Emoji</a> (MIT) · 글꼴 <a href="https://github.com/quiple/galmuri">Galmuri</a> (OFL)</footer>
</div></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="스토리 이미지">
  <div class="win"><div class="tb lemon"><span>STORY.PNG</span><i><b></b></i></div><div class="body" style="display:grid;gap:10px;text-align:center">
    <img id="shot" alt="인스타 스토리용 오늘의 성적표 이미지"><p class="meta" id="mmsg" style="margin:0"></p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><a class="btn" id="dl" download>이미지 저장</a><button class="btn" id="close">닫기</button></div>
  </div></div>
</div>

<script>
{
const $ = s => document.querySelector(s);
const won = n => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(Math.round(n)).toLocaleString("ko-KR") + "원";
const cls = n => n > 0 ? "up" : n < 0 ? "dn" : "zero";
const el = (tag, props = {}, kids = []) => { const e = document.createElement(tag); Object.assign(e, props); kids.forEach(k => e.append(k)); return e; };
const img = (n, c = "") => el("img", { src: `assets/${n}.png`, alt: "", className: c });
const BOT = { kr: { name: "국장 봇", char: "robot", col: "#ff8a1f" }, us: { name: "미장 봇", char: "alien", col: "#8b5cff" } };
let D = { days: [] }, dates = [], cur = 0, mkt = "all", wk0 = null;
const HOL = { kr: ["2026-12-25", "2026-12-31", "2027-01-01"], us: ["2026-11-26", "2026-12-25", "2027-01-01", "2027-01-18", "2027-02-15"] };
const iso = t => `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
const monday = d => { const t = new Date(d + "T00:00:00"); t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return t; };
const short = n => { const a = Math.abs(n), s = n > 0 ? "+" : n < 0 ? "−" : ""; return a >= 10000 ? s + (a / 10000).toFixed(a >= 100000 ? 0 : 1) + "만" : s + Math.round(a).toLocaleString("ko-KR"); };
const mk = x => mkt === "all" || x.market === mkt;
const idle = (d, m) => HOL[m].includes(d) ? ["휴장", m === "us" ? "미국 증시 휴장일이에요" : "한국 증시 휴장일이에요"]
  : d >= todayIn(m) ? ["대기 중", m === "us" ? "한국 시간 23:30 개장 예정" : "09:00 개장 예정"] : ["휴식", "이날은 매매가 없었어요"];
const todayIn = m => new Intl.DateTimeFormat("en-CA", { timeZone: m === "us" ? "America/New_York" : "Asia/Seoul" }).format(new Date());
const byDate = d => D.days.filter(x => x.date === d);
const pick = (d, m) => D.days.find(x => x.date === d && x.market === m);
const fmtD = d => { const t = new Date(d + "T00:00:00"); return `${t.getMonth() + 1}월 ${t.getDate()}일 (${"일월화수목금토"[t.getDay()]})`; };

// ---- sound: 8-bit chiptune BGM + effects, synthesized with Web Audio (no audio files)
const Snd = (() => {
  let ctx = null, bgmG, sfxG, timer = null, step = 0, next = 0;
  const ensure = () => {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination);
      bgmG = ctx.createGain(); bgmG.gain.value = .16; bgmG.connect(master);
      sfxG = ctx.createGain(); sfxG.gain.value = .32; sfxG.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  };
  const hz = n => 440 * 2 ** ((n - 69) / 12);
  const tone = (f, t, d, type = "square", out = sfxG, vol = 1) => {
    const o = ctx.createOscillator(), a = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    a.gain.setValueAtTime(vol, t); a.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(a); a.connect(out); o.start(t); o.stop(t + d + .03);
  };
  const hat = (t) => {
    const len = Math.floor(ctx.sampleRate * .04), b = ctx.createBuffer(1, len, ctx.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ctx.createBufferSource(), a = ctx.createGain(); a.gain.value = .25; s.buffer = b; s.connect(a); a.connect(bgmG); s.start(t);
  };
  // 4 bars of eighth notes (0 = rest): bouncy C-major loop
  const LEAD = [72,0,76,79, 0,76,74,0, 72,0,76,79, 84,0,83,0, 81,0,77,81, 0,77,76,0, 74,0,77,76, 74,0,71,0];
  const BASS = [48,48,55,55, 53,53,55,55, 48,48,55,55, 53,53,55,55];
  const sched = () => {
    const e = 60 / 138 / 2;
    while (next < ctx.currentTime + .2) {
      const i = step % 32, n = LEAD[i];
      if (n) tone(hz(n), next, e * .85, "square", bgmG, .55);
      if (i % 2 === 0) tone(hz(BASS[(i / 2) % 16]), next, e * 1.7, "triangle", bgmG, 1);
      if (i % 2 === 1) hat(next);
      next += e; step++;
    }
  };
  let bgmOn = false, sfxOn = false;
  return {
    get bgm() { return bgmOn; }, get sfx() { return sfxOn; },
    setBgm(on) { bgmOn = on; clearInterval(timer); timer = null; if (on) { ensure(); next = ctx.currentTime + .08; timer = setInterval(sched, 60); } },
    setSfx(on) { sfxOn = on; if (on) ensure(); },
    pause(p) { if (!ctx) return; p ? ctx.suspend() : ctx.resume(); },
    click() { if (!sfxOn) return; ensure(); tone(1046, ctx.currentTime, .05); },
    coin() { if (!sfxOn) return; const t = ensure().currentTime; tone(988, t, .09); tone(1319, t + .09, .35); },
    sad() { if (!sfxOn) return; const t = ensure().currentTime; [392, 370, 349, 311].forEach((f, i) => tone(f, t + i * .17, .24, "triangle")); },
    boot() { if (!sfxOn) return; const t = ensure().currentTime; [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, t + i * .08, .16)); }
  };
})();
let userNav = false, soundDay = "";
document.addEventListener("click", e => { if (e.target.closest("button,a")) { userNav = true; setTimeout(() => userNav = false, 0); if (!e.target.closest(".snd")) Snd.click(); } }, true);
document.addEventListener("visibilitychange", () => Snd.pause(document.hidden));
const savePref = () => { try { localStorage.setItem("botdiary-sound", JSON.stringify({ bgm: Snd.bgm, sfx: Snd.sfx })); } catch (e) {} };
const syncBtns = () => {
  $("#bgmBtn").setAttribute("aria-pressed", Snd.bgm); $("#bgmBtn").textContent = Snd.bgm ? "♪ BGM 켬" : "♪ BGM 끔";
  $("#sfxBtn").setAttribute("aria-pressed", Snd.sfx); $("#sfxBtn").textContent = Snd.sfx ? "효과음 켬" : "효과음 끔";
};
$("#bgmBtn").onclick = () => { Snd.setBgm(!Snd.bgm); syncBtns(); savePref(); };
$("#sfxBtn").onclick = () => { Snd.setSfx(!Snd.sfx); syncBtns(); savePref(); Snd.boot(); };
try {   // 지난번 설정 기억: 브라우저 정책상 화면을 한 번 누른 뒤에 소리가 시작됨
  const pref = JSON.parse(localStorage.getItem("botdiary-sound") || "{}");
  if (pref.bgm || pref.sfx) document.addEventListener("pointerdown", () => { if (pref.sfx) Snd.setSfx(true); if (pref.bgm) Snd.setBgm(true); syncBtns(); }, { once: true });
} catch (e) {}

function renderToday() {
  const d = dates[cur], day = byDate(d), sum = day.reduce((a, x) => a + x.pnl, 0);
  $("#todayT").textContent = `TODAY.EXE · ${fmtD(d)}`;
  for (const m of ["kr", "us"]) {
    const x = pick(d, m), box = $("#" + m); box.replaceChildren();
    const ch = el("div", { className: "char" }, [img(BOT[m].char, "me")]);
    if (x && x.pnl > 0) ch.append(img("crown", "hat"));

        el("div", { textContent: x.note || "", style: "font-size:13px;margin-top:4px" }));
    } else { const [a, b] = idle(d, m); card.append(el("div", { className: "big zero", textContent: a }), el("div", { className: "meta", textContent: b })); }
    box.append(ch, card);
  }
  document.querySelectorAll(".coin").forEach(c => c.remove());
  if (sum > 0) for (let i = 0; i < 10; i++) { const c = img(i % 3 ? "coin" : "sparkles", "coin"); c.style.left = (5 + i * 9.5) + "%"; c.style.animationDuration = (2.6 + (i * 7 % 10) / 4) + "s"; c.style.animationDelay = (-(i * 0.7)) + "s"; $("#scene").append(c); }
  const s = $("#sum"); s.textContent = `오늘 합계 ${won(sum)}`; s.className = cls(sum);

function renderWeek() {
  const m0 = wk0 || monday(dates[cur]), days = [...Array(5)].map((_, i) => { const t = new Date(m0); t.setDate(t.getDate() + i); return iso(t); });

        c.onclick = () => { cur = dates.indexOf(d); renderToday(); };
      } else if (HOL[m].includes(d)) c = el("div", { className: "cell off" }, [el("b", { textContent: "휴" }), el("small", { textContent: "휴장" })]);
      else if (d >= todayIn(m)) c = el("div", { className: "cell fut" }, [el("b", { textContent: "·" }), el("small", { textContent: "예정" })]);

}
function renderScore() {
  const box = $("#score"); box.replaceChildren();
  for (const m of ["kr", "us"].filter(m => mkt === "all" || mkt === m)) {
    const xs = D.days.filter(x => x.market === m), w = xs.reduce((a, x) => a + x.wins, 0), l = xs.reduce((a, x) => a + x.losses, 0), s = xs.reduce((a, x) => a + x.pnl, 0);
    const seg = el("div", { className: "seg" }); const t = w + l || 1, nW = Math.round(w / t * 12);
    for (let i = 0; i < 12; i++) seg.append(el("span", { style: `background:${i < nW ? "var(--up)" : "var(--dn)"}` }));
    const info = el("div", {}, [el("strong", { textContent: `${BOT[m].name} ${w}승 ${l}패` }), seg,
      el("div", { className: "meta" }, [`${xs.length}일 중 ${xs.filter(x => x.pnl > 0).length}일 수익 · 누적 `, el("b", { className: cls(s), textContent: won(s) })])]);
    box.append(el("div", { className: "row" }, [img(BOT[m].char), info]));

  box.append(el("div", { className: "row" }, [img(all >= 0 ? "trophy" : "bomb"), el("div", {}, [el("div", { className: "meta", textContent: mkt === "all" ? "전체 누적 (국장+미장)" : `${mkt === "kr" ? "국장" : "미장"} 누적` }), el("div", { className: "big " + cls(all), textContent: won(all) })])]));

function renderCal() {
  const t = new Date(dates[cur] + "T00:00:00"), y = t.getFullYear(), mo = t.getMonth();
  $("#calT").textContent = `CALENDAR.APP · ${y}년 ${mo + 1}월`;
  const box = $("#cal"); box.replaceChildren(...[..."일월화수목금토"].map(c => el("div", { className: "dow", textContent: c })));
  for (let i = 0; i < new Date(y, mo, 1).getDay(); i++) box.append(el("div"));
  for (let i = 1; i <= new Date(y, mo + 1, 0).getDate(); i++) {
    const k = `${y}-${String(mo + 1).padStart(2, "0")}-${String(i).padStart(2, "0")}`, rows = byDate(k).filter(mk);
    if (!rows.length) { box.append(el("div", { className: "d" }, [el("span", { textContent: i })])); continue; }

    b.setAttribute("aria-label", `${i}일 ${won(s)}`); b.onclick = () => { cur = dates.indexOf(k); renderToday(); };

function renderLoot() {

  $("#lootT").textContent = `LOOT.TXT · ${fmtD(d)}`;

  xs.forEach(t => ul.append(el("li", {}, [img(t.pnl >= 0 ? "gem" : "bomb"),
    el("span", {}, [t.name + " ", el("span", { className: "meta", textContent: t.m === "kr" ? "국장" : "미장" })]),
    el("span", { className: "num " + cls(t.pnl), textContent: won(t.pnl) })])));

const svg = $("#chart");
function drawChart() {
  const W = svg.clientWidth, H = svg.clientHeight; if (!W || !dates.length) return;
  let acc = 0; const s = dates.map(d => acc += byDate(d).filter(x => mkt === "all" || x.market === mkt).reduce((a, x) => a + x.pnl, 0));
  const L = 10, R = W < 440 ? 92 : 120, T = 22, B = 28, lo = Math.min(0, ...s), hi = Math.max(0, ...s), sp = hi - lo || 1;
  const X = i => L + (s.length < 2 ? (W - L - R) / 2 : i * (W - L - R) / (s.length - 1)), Y = v => T + (hi - v) / sp * (H - T - B);
  const col = mkt === "kr" ? "#ff8a1f" : mkt === "us" ? "#8b5cff" : "#ff4fa3";
  let p = `M${X(0)},${Y(0)}`; s.forEach((v, i) => p += `H${X(i)}V${Y(v)}`);
  const area = p + `H${X(s.length - 1)}V${Y(0)}Z`, lv = s[s.length - 1];
  const ns = "http://www.w3.org/2000/svg";
  svg.innerHTML = `<path d="${area}" fill="${col}" opacity=".25"/><path d="${p}" fill="none" stroke="#111" stroke-width="7" stroke-linejoin="round"/><path d="${p}" fill="none" stroke="${col}" stroke-width="4" stroke-linejoin="round"/><line x1="${L}" x2="${W - R + 10}" y1="${Y(0)}" y2="${Y(0)}" stroke="#111" stroke-dasharray="5 5" opacity=".5"/>`;
  s.forEach((v, i) => { const r = document.createElementNS(ns, "rect"); Object.entries({ x: X(i) - 6, y: Y(v) - 6, width: 12, height: 12, fill: "#ffe14d", stroke: "#111", "stroke-width": 3 }).forEach(([k, val]) => r.setAttribute(k, val)); svg.append(r);
    if (W >= 440 || i % 2 === 0 || i === s.length - 1) { const t = document.createElementNS(ns, "text"); t.setAttribute("x", X(i)); t.setAttribute("y", H - 6); t.setAttribute("text-anchor", "middle"); t.setAttribute("font-size", "13"); t.textContent = `${+dates[i].slice(5, 7)}/${+dates[i].slice(8)}`; svg.append(t); } });
  const t = document.createElementNS(ns, "text"); t.setAttribute("x", X(s.length - 1) + 12); t.setAttribute("y", Y(lv) + 5); t.setAttribute("font-size", "15"); t.setAttribute("font-weight", "700"); t.setAttribute("fill", lv >= 0 ? "#ff2d55" : "#1f5bff"); t.textContent = won(lv); svg.append(t);
}
const ro = new ResizeObserver(drawChart); ro.observe(svg);

const loadImg = n => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = `assets/${n}.png`; });
async function story() {
  await document.fonts.ready;
  const d = dates[cur], day = byDate(d), sum = day.reduce((a, x) => a + x.pnl, 0);
  const c = el("canvas", { width: 1080, height: 1920 }), g = c.getContext("2d");

  g.fillStyle = "#fff"; g.font = F(700, 92); g.textAlign = "center"; g.fillText("봇 매매일지 98", 540, 170);

    g.drawImage(await loadImg(BOT[m].char), 100, y + 120, 320, 320);

  }

}

$("#prev").onclick = () => { if (cur > 0) { cur--; renderToday(); } };
$("#next").onclick = () => { if (cur < dates.length - 1) { cur++; renderToday(); } };
$("#share").onclick = () => story().catch(e => { $("#mmsg").textContent = "이미지를 만들지 못했어요: " + e.message; $("#modal").classList.add("on"); });
$("#close").onclick = () => $("#modal").classList.remove("on");
document.querySelectorAll(".seg3 button").forEach(b => b.onclick = () => { mkt = b.dataset.m; document.querySelectorAll(".seg3 button").forEach(t => t.setAttribute("aria-pressed", t === b)); renderScore(); renderToday(); drawChart(); });
const shiftWeek = n => { const m0 = wk0 || monday(dates[cur]); wk0 = new Date(m0); wk0.setDate(wk0.getDate() + 7 * n); renderWeek(); };

fetch("data.json", { cache: "no-store" }).then(r => r.json()).then(j => {
